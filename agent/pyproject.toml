[project]
name = "voice-agent"
version = "1.0.0"
description = "Self-contained Voice AI Agent with SHDR-31 Raymarched Godray Orb"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit>=0.18.0",
    "livekit-agents>=0.12.0",
    "livekit-plugins-silero>=0.8.0",
    "livekit-plugins-cartesia>=0.8.0",
    "livekit-plugins-elevenlabs>=0.8.0",
    "livekit-plugins-openai>=0.8.0",
    "livekit-plugins-speechmatics>=0.8.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
